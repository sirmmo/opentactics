[package]
name = "opentactics-server"
version = "0.1.0"
edition = "2021"
description = "Serves the OpenTactics site and a shared map library. Games themselves run browser to browser."

[dependencies]
opentactics-core = { path = "../core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
