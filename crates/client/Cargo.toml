[package]
name = "opentactics-client"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the OpenTactics rules engine"

[lib]
name = "opentactics"
crate-type = ["cdylib"]

[dependencies]
opentactics-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
