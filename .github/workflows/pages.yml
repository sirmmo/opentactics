name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test the engine
        run: cargo test --release -p opentactics-core
      - name: Build the WebAssembly engine
        run: |
          cargo build --profile wasm --target wasm32-unknown-unknown -p opentactics-client
          cp target/wasm32-unknown-unknown/wasm/opentactics.wasm site/opentactics.wasm
          touch site/.nojekyll
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
